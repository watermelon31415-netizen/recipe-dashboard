Today

        <section class="card">

</option>

<option value="Breakfast">

</option>

<option value="Lunch">
Lunch
</option>

<option value="Dinner">
Dinner
</option>

</select>


<br><br>


<label>
Time
</label>


<select id="randomTime">

<option value="">
Any
</option>


<option value="30">
≤30 min
</option>

≤60 min
</option>

</select>

<label>
Tag
</label>

id="randomTag"
placeholder="例如 High Protein"
>

<div id="randomRecipe">

<button id="randomButton">

🎲 Random

</button>
